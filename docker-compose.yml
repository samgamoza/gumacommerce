services:
  postgres:
    image: postgres:16-alpine
    container_name: guma-commerce-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guma_commerce
    volumes:
      - guma_commerce_pgdata:/var/lib/postgresql/data

volumes:
  guma_commerce_pgdata:
